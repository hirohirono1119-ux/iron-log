[project]
name = "lag-trader"
version = "0.1.0"
description = "暗号資産リード・ラグ追随ツール(Phase 1: Collector)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
