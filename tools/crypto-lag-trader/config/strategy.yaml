# 戦略・リスク設定。稼働中も定期リロードされる(コード変更なしで調整可能)
mode: paper   # paper | live

collector:
  data_dir: data
  flush_interval_sec: 60     # ティックの Parquet 書き出し間隔
  watchdog_stale_sec: 30     # この秒数データが来なければ警告ログ

# Phase 3 以降で使用(DESIGN.md §3.2〜3.3)
signal:
  resample_ms: 500
  min_corr: 0.6
  leader_move_pct: 0.15      # T秒でのリーダー変動閾値 X
  window_sec: 10             # T
  follow_ratio: 0.5          # α
  timeout_lag_mult: 3        # k

risk:
  max_order_jpy: 5000
  max_position_jpy: 10000
  max_daily_loss_jpy: 3000
  max_trades_per_day: 20
  kill_switch: false
